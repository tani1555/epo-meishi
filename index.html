function parseCardText(text){
  let t = normalizeText(text);
  let lines = t.split('\n').map(x=>x.trim()).filter(Boolean);
  let o = {
    date:new Date().toISOString().slice(0,10),
    status:'未対応'
  };

    let cleaned = emailLine
      .replace(/e[\s-]*mail\s*[:：]?\s*/i,'')
      .replace(/\s+/g,'');
    let m = cleaned.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i);
    if(m) o.email = m[0];
  }
  if(!o.email){
    let compact = t.replace(/\s+/g,'');
    let m = compact.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i);
    if(m) o.email = m[0];
  }

  // Webサイト
  o.web = firstMatch(
    t,
    /((?:https?:\/\/)?(?:www\.)?[a-z0-9][a-z0-9.-]+\.(?:jp|com|net|org|co\.jp)(?:\/\S*)?)/i
  );

  // 郵便番号
  // 〒800-0077、〒8002-0077 のようなOCR揺れにも対応
  let zipLine = lines.find(x=>/〒|郵便/.test(x));
  if(zipLine){
    let digits = zipLine.replace(/[^\d]/g,'');
    if(digits.length >= 7){
      digits = digits.slice(0,7);
      o.zip = digits.slice(0,3) + '-' + digits.slice(3);
    }
  }

  // 電話番号：ラベルを最優先
  const phoneRx = /0\d{1,4}[-ー―‐\s]\d{1,4}[-ー―‐\s]\d{3,4}/g;

  for(const line of lines){
    let matches = line.match(phoneRx);
    if(!matches) continue;

    for(let val of matches){
      val = val.replace(/[ー―‐\s]/g,'-');

      if(/FAX|ファックス/i.test(line)){
        if(!o.fax) o.fax = val;
        continue;
      }

      if(/携帯|Mobile|MOBILE|携帯電話/i.test(line)){
        if(!o.mobile) o.mobile = val;
        continue;
      }

      // TEL: と明記されている場合は070でもTELへ入れる
      if(/TEL|Tel|電話/i.test(line)){
        if(!o.tel) o.tel = val;
        continue;
      }

      // ラベルが無い場合だけ070/080/090を携帯扱い

      }else{
        if(!o.tel) o.tel = val;
      }
    }

  let companyLine = lines.find(x=>
    /(株式会社|有限会社|合同会社|一般社団法人|一般財団法人|社会福祉法人|医療法人|学校法人|NPO法人|特定非営利活動法人)/.test(x)
  );
  if(companyLine){
    o.company = companyLine
      .replace(/^(会社名|Company)[:：\s]*/i,'')
      .trim();
  }

  // 事業所名
  let officeLine = lines.find(x=>
    /(事業所|営業所|支店|支社|センター|オフィス|Office)/i.test(x) &&
    x !== companyLine
  );
  if(officeLine) o.office = officeLine.trim();

  // 部署
  let dept = lines.find(x=>
    /(事業部|営業部|総務部|管理部|IT部門|開発部|企画部|チーム|部|課|室|局)/.test(x) &&
    !/(住所|会社名)/.test(x)
  );
  if(dept) o.department = dept.trim();

  // 役職
  let title = lines.find(x=>
    /(代表取締役|取締役|代表社員|社長|副社長|専務|常務|部長|課長|係長|主任|所長|施設長|管理者|責任者|マネージャー|エンジニア|デザイナー)/.test(x)
  );

  // 住所
  let addrLines = lines.filter(x=>
    /(都|道|府|県).*(市|区|郡|町|村)/.test(x) &&
    !/@|https?:|www\.|TEL|FAX/i.test(x)
  );
  if(addrLines.length){
    o.address = addrLines.join(' ')
      .replace(/〒?\s*\d{3}[-ー―‐\s]?\d{4}/,'')
      .trim();
  }

  // 氏名候補
  const bad = /(株式会社|有限会社|合同会社|法人|事業所|営業所|支店|支社|センター|部|課|室|代表|取締役|社長|部長|課長|主任|TEL|FAX|電話|携帯|Mail|E-mail|@|http|www|〒|\d{2,})/i;

  let candidates = lines.filter(x=>
    !bad.test(x) &&
    !/(都|道|府|県).*(市|区|郡|町|村)/.test(x)
  );

  let nameLine = candidates.find(x=>{
    let s=x.replace(/\s/g,'');

  });

  if(nameLine){
    o.name = nameLine.replace(/\s+/g,' ').trim();
  }

  // 英字氏名
  let roman = candidates.find(x=>
    /^[A-Za-z][A-Za-z .'-]{2,35}$/.test(x) &&
    x.split(/\s+/).length >= 2
  );
  if(roman) o.roman = roman.trim();

  return o;

function loadImage(src){
  return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src})
}
async function makeProcessed(angle=0){
  const im=await loadImage(preview.src);
  const rad=((angle%360)+360)%360;
  const swap=rad===90||rad===270;
  const maxSide=2200;
  let scale=Math.min(2.2,maxSide/Math.max(im.naturalWidth,im.naturalHeight));
  scale=Math.max(1,scale);
  let sw=Math.round(im.naturalWidth*scale), sh=Math.round(im.naturalHeight*scale);
  const c=document.getElementById('workCanvas');
  c.width=swap?sh:sw; c.height=swap?sw:sh;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.save(); ctx.translate(c.width/2,c.height/2); ctx.rotate(rad*Math.PI/180);
  ctx.drawImage(im,-sw/2,-sh/2,sw,sh); ctx.restore();
  let img=ctx.getImageData(0,0,c.width,c.height), d=img.data;
  // grayscale + contrast. Keep dark text strong while whitening the background.
  for(let i=0;i<d.length;i+=4){
    let g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    g=(g-128)*1.35+128;
    g=Math.max(0,Math.min(255,g));
    if(g>225) g=255;
    d[i]=d[i+1]=d[i+2]=g;
  }
  ctx.putImageData(img,0,0);
  return c.toDataURL('image/jpeg',0.94);
}
async function manualRotate(delta){
  manualAngle=(manualAngle+delta+360)%360;

  preview.src=p;
  selectedFile=null;
  manualAngle=0;
  rawOcr.value=''; fill({date:new Date().toISOString().slice(0,10),status:'未対応'});
  ocrStatus.textContent='画像を回転しました。もう一度「無料OCRで読み取る」を押してください。';

function usefulScore(r){
  const txt=(r.data.text||'').trim();
  const chars=(txt.match(/[A-Za-z0-9一-龯ぁ-んァ-ヶ]/g)||[]).length;
  const contacts=(txt.match(/@|TEL|FAX|〒|\d{2,4}[-ー]\d{2,4}/gi)||[]).length;
  return (r.data.confidence||0) + Math.min(chars,80)*0.35 + contacts*8;
}

  try{
    const worker=await Tesseract.createWorker('jpn+eng',1,{logger:m=>{
      if(m.progress!=null){let p=Math.round(m.progress*100);ocrBar.style.width=p+'%';ocrStatus.textContent=(m.status||'OCR処理中')+' '+p+'%'}
    }});
    let candidates=[];
    // First: current orientation.
    let img0=await makeProcessed(0);
    let r0=await worker.recognize(img0);
    candidates.push({angle:0,r:r0,score:usefulScore(r0)});
    // If recognition is weak, automatically test right and left 90 degrees.
    if((r0.data.confidence||0)<65 || (r0.data.text||'').trim().length<25){
      ocrStatus.textContent='向きを変えて再判定しています…';
      for(const a of [90,270]){
        let imga=await makeProcessed(a);
        let rr=await worker.recognize(imga);
        candidates.push({angle:a,r:rr,score:usefulScore(rr)});
      }
    }
    await worker.terminate();
    candidates.sort((a,b)=>b.score-a.score);
    const best=candidates[0];
    rawOcr.value=best.r.data.text||'';
    ocrBar.style.width='100%';
    if(!rawOcr.value.trim() || (best.r.data.confidence||0)<25){
      fill({date:new Date().toISOString().slice(0,10),status:'未対応'});
      ocrStatus.textContent='十分に読み取れませんでした。名刺を画面いっぱいに撮影するか、左右90°ボタンで向きを直して再度お試しください。';
      return;
    }
    parseAndFill(rawOcr.value);
    ocrStatus.textContent=`OCR完了（自動判定角度 ${best.angle}° / 信頼度 ${Math.round(best.r.data.confidence||0)}%）。内容を確認・修正してください。`;
  }catch(e){
    console.error(e);
    ocrStatus.textContent='OCRでエラーが発生しました。通信状態を確認して、もう一度お試しください。';
    alert('OCRに失敗しました: '+e.message);
  }finally{ocrBtn.disabled=false}
}

function save(){let o={id:Date.now(),image:preview.src};defs.forEach(([id])=>o[id]=document.getElementById(id).value);let a=JSON.parse(localStorage.getItem('epoCards')||'[]');a.unshift(o);localStorage.setItem('epoCards',JSON.stringify(a));alert('登録しました');show('list');render()}
function clearForm(){fill({});preview.classList.add('hidden');ocrBox.classList.add('hidden');rawOcr.value='';ocrBar.style.width='0%'}
function render(){let a=JSON.parse(localStorage.getItem('epoCards')||'[]'),s=(q.value||'').toLowerCase();a=a.filter(x=>[x.company,x.name,x.tel,x.email].join(' ').toLowerCase().includes(s));rows.innerHTML=a.map(x=>`<tr><td>${esc(x.company)}</td><td>${esc(x.name)}</td><td>${esc(x.tel)}</td><td>${esc(x.email)}</td><td><span class="badge">${esc(x.status)}</span></td><td><button onclick="del(${x.id})">削除</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">登録データはありません</td></tr>'}
function del(id){if(!confirm('削除しますか？'))return;let a=JSON.parse(localStorage.getItem('epoCards')||'[]').filter(x=>x.id!==id);localStorage.setItem('epoCards',JSON.stringify(a));render()}
function exportCSV(){let a=JSON.parse(localStorage.getItem('epoCards')||'[]');let h=defs.map(x=>x[1]),keys=defs.map(x=>x[0]);let csv='\ufeff'+h.join(',')+'\n'+a.map(o=>keys.map(k=>'"'+String(o[k]||'').replaceAll('"','""')+'"').join(',')).join('\n');let b=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(b),ael=document.createElement('a');ael.href=u;ael.download='EPO名刺管理.csv';ael.click();URL.revokeObjectURL(u)}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function show(v){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));document.getElementById(v).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));if(v==='list')render()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.v));
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
}
</script></body></html>
