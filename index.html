<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPO 名刺管理 OCR版</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><link rel="manifest" href="manifest.json"><style>
:root{--b:#0969da;--bg:#f5f7fb;--bd:#d8dee8;--tx:#172033}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--tx)}header{background:#fff;border-bottom:1px solid var(--bd);padding:14px 18px;font-weight:800;color:#064b9a;position:sticky;top:0}main{max-width:1000px;margin:auto;padding:18px}.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tabs button,.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.tabs button{background:#e9eef6}.tabs button.on,.btn{background:var(--b);color:white}.card{background:white;border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #0000000a}.hero{text-align:center;padding:28px}.camera{font-size:20px;padding:18px 26px}.preview{max-width:310px;width:100%;border-radius:10px;margin:12px auto;display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-size:12px;font-weight:700;color:#536176}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd4e1;border-radius:8px;margin-top:5px;font:inherit}textarea{min-height:90px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.secondary{background:#e8eef7;color:#17355d}.danger{background:#b42318}.hidden{display:none}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5e9f0;font-size:14px}.muted{color:#687386;font-size:13px}.badge{background:#dbeafe;color:#0756a8;border-radius:999px;padding:3px 8px;font-size:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}table{display:block;overflow:auto}.camera{width:100%;font-size:22px;padding:22px}}
</style></head><body><header>💳 EPO 名刺管理 <span class="muted">無料OCR版 v4</span></header><main><div class="muted" style="text-align:right;margin-bottom:8px">Version 4.0</div>
<div class="tabs"><button class="on" data-v="scan">名刺を読み取る</button><button data-v="list">顧客一覧</button></div>
<section id="scan">
<div class="card hero"><h2>名刺を撮影・選択</h2><p class="muted">スマホではカメラが起動します。PCでは画像ファイルを選択できます。</p><input id="file" type="file" accept="image/*" capture="environment" hidden><button class="btn camera" onclick="file.click()">📷 名刺を撮影</button><img id="preview" class="preview hidden"></div>
<div id="ocrBox" class="card hidden"><h2>OCR読み取り</h2><p id="ocrStatus" class="muted">画像を選択すると日本語＋英語OCRを開始できます。</p><div style="height:10px;background:#e8eef7;border-radius:999px;overflow:hidden"><div id="ocrBar" style="height:100%;width:0;background:#0969da;transition:.2s"></div></div><div class="actions">
<button id="ocrBtn" class="btn" onclick="runOCR()">🔎 無料OCRで読み取る</button>
<button class="btn secondary" onclick="manualRotate(-90)">↶ 左90°</button>
<button class="btn secondary" onclick="manualRotate(90)">↷ 右90°</button>
</div>
<p class="muted">v4では画像を拡大・グレースケール・コントラスト補正し、認識が弱い場合は向きを変えて再判定します。</p>
<canvas id="workCanvas" class="hidden"></canvas><details style="margin-top:12px"><summary>OCR原文を確認</summary><textarea id="rawOcr" style="width:100%;min-height:160px"></textarea><button class="btn secondary" onclick="parseAndFill(rawOcr.value)">原文から項目を再判定</button></details></div>
<div id="formCard" class="card hidden"><h2>読み取り結果の確認</h2><p class="muted">OCR結果は誤認識する場合があります。登録前に必ず内容を確認・修正してください。</p><div class="grid" id="fields"></div><div class="actions"><button class="btn" onclick="save()">この内容で登録</button><button class="btn secondary" onclick="clearForm()">クリア</button></div></div>
</section>
<section id="list" class="hidden"><div class="card"><h2>顧客一覧</h2><input id="q" placeholder="会社名・氏名・電話・メールで検索" oninput="render()"><div class="actions"><button class="btn secondary" onclick="exportCSV()">CSV出力</button></div><div style="overflow:auto;margin-top:12px"><table><thead><tr><th>会社名</th><th>氏名</th><th>TEL</th><th>メール</th><th>ステータス</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></section>
</main><script>
const defs=[['company','会社名'],['office','事業所名'],['department','部署／部門'],['title','役職'],['name','氏名'],['kana','ふりがな'],['roman','英字氏名'],['zip','郵便番号'],['address','住所','full'],['tel','TEL'],['fax','FAX'],['mobile','携帯電話'],['email','メールアドレス'],['web','Webサイト'],['date','名刺交換日'],['event','イベント名／場所'],['owner','自社担当者'],['status','ステータス'],['memo','メモ','full']];
const fields=document.getElementById('fields'); defs.forEach(([id,l,c])=>{let d=document.createElement('div');if(c)d.className=c;d.innerHTML=`<label>${l}<${id==='memo'?'textarea':'input'} id="${id}" ${id==='date'?'type="date"':''}></${id==='memo'?'textarea':'input'}></label>`;fields.appendChild(d)});
function fill(o){defs.forEach(([id])=>document.getElementById(id).value=o[id]||'');formCard.classList.remove('hidden')}
let selectedFile=null, manualAngle=0;
file.onchange=e=>{let f=e.target.files[0];if(!f)return;selectedFile=f;manualAngle=0;preview.src=URL.createObjectURL(f);preview.classList.remove('hidden');ocrBox.classList.remove('hidden');rawOcr.value='';ocrBar.style.width='0%';ocrStatus.textContent='画像を選択しました。「無料OCRで読み取る」を押してください。';fill({date:new Date().toISOString().slice(0,10),status:'未対応'})}

function normalizeText(t){return String(t||'').replace(/\r/g,'').replace(/[：]/g,':').replace(/[‐‑‒–—―ー]/g,'-').replace(/＠/g,'@').replace(/[．。]/g,'.').replace(/\u3000/g,' ').trim()}
function firstMatch(t,re){let m=t.match(re);return m?m[1].trim():''}
function parseCardText(text){
  let t=normalizeText(text), lines=t.split('\n').map(x=>x.trim()).filter(Boolean), o={date:new Date().toISOString().slice(0,10),status:'未対応'};
  o.email=firstMatch(t,/([A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,})/i);
  o.web=firstMatch(t,/((?:https?:\/\/|www\.)[^\s]+)/i);
  o.zip=firstMatch(t,/(?:〒\s*)?(\d{3}\s*-\s*\d{4})/); if(o.zip)o.zip=o.zip.replace(/\s/g,'');
  o.fax=firstMatch(t,/(?:FAX|Fax|fax)\s*[:：]?\s*([0-9()\-\s]{9,})/); if(o.fax)o.fax=o.fax.replace(/\s/g,'');
  o.tel=firstMatch(t,/(?:TEL|Tel|tel|電話)\s*[:：]?\s*([0-9()\-\s]{9,})/); if(o.tel)o.tel=o.tel.replace(/\s/g,'');
  o.mobile=firstMatch(t,/(?:携帯|Mobile|MOBILE)\s*[:：]?\s*([0-9()\-\s]{10,})/i); if(o.mobile)o.mobile=o.mobile.replace(/\s/g,'');
  let company=lines.find(x=>/(株式会社|有限会社|合同会社|合資会社|一般社団法人|社会福祉法人|医療法人)/.test(x)); if(company)o.company=company.replace(/\s+/g,' ').trim();
  let addr=lines.find(x=>/(都|道|府|県|市|区|町|村).*[0-9０-９]/.test(x) && !/(TEL|FAX|@)/i.test(x)); if(addr)o.address=addr.replace(/^〒?\s*\d{3}-?\d{4}\s*/,'');
  let dept=lines.find(x=>/(部門|部署|営業部|総務部|企画部|開発部|課|チーム)/.test(x)); if(dept){let parts=dept.split(/\s+/); o.department=parts[0]; if(parts.length>1)o.title=parts.slice(1).join(' ')}
  let title=lines.find(x=>/(社長|代表取締役|取締役|部長|課長|係長|主任|マネージャー|エンジニア|チーフ)/.test(x) && x!==dept); if(title && !o.title)o.title=title;
  let jpCandidates=lines.filter(x=>/^[一-龯々ヶぁ-んァ-ヶー\s]{3,15}$/.test(x) && !/(株式会社|部門|部署|市|区|町|村)/.test(x));
  if(jpCandidates.length)o.name=jpCandidates.sort((a,b)=>b.replace(/\s/g,'').length-a.replace(/\s/g,'').length)[0];
  let roman=lines.find(x=>/^[A-Za-z][A-Za-z .'-]{3,40}$/.test(x) && !/^(TEL|FAX|Mail|Email|EPO)$/i.test(x)); if(roman)o.roman=roman;
  return o;
}
function parseAndFill(text){let parsed=parseCardText(text); fill({date:new Date().toISOString().slice(0,10),status:'未対応'}); defs.forEach(([id])=>{if(parsed[id])document.getElementById(id).value=parsed[id]});formCard.classList.remove('hidden');ocrStatus.textContent='この名刺のOCR結果を反映しました。内容を確認・修正してから登録してください。'}
function loadImage(src){
  return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src})
}
async function makeProcessed(angle=0){
  const im=await loadImage(preview.src);
  const rad=((angle%360)+360)%360;
  const swap=rad===90||rad===270;
  const maxSide=2200;
  let scale=Math.min(2.2,maxSide/Math.max(im.naturalWidth,im.naturalHeight));
  scale=Math.max(1,scale);
  let sw=Math.round(im.naturalWidth*scale), sh=Math.round(im.naturalHeight*scale);
  const c=document.getElementById('workCanvas');
  c.width=swap?sh:sw; c.height=swap?sw:sh;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.save(); ctx.translate(c.width/2,c.height/2); ctx.rotate(rad*Math.PI/180);
  ctx.drawImage(im,-sw/2,-sh/2,sw,sh); ctx.restore();
  let img=ctx.getImageData(0,0,c.width,c.height), d=img.data;
  // grayscale + contrast. Keep dark text strong while whitening the background.
  for(let i=0;i<d.length;i+=4){
    let g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    g=(g-128)*1.35+128;
    g=Math.max(0,Math.min(255,g));
    if(g>225) g=255;
    d[i]=d[i+1]=d[i+2]=g;
  }
  ctx.putImageData(img,0,0);
  return c.toDataURL('image/jpeg',0.94);
}
async function manualRotate(delta){
  manualAngle=(manualAngle+delta+360)%360;
  const p=await makeProcessed(manualAngle);
  preview.src=p;
  selectedFile=null;
  manualAngle=0;
  rawOcr.value=''; fill({date:new Date().toISOString().slice(0,10),status:'未対応'});
  ocrStatus.textContent='画像を回転しました。もう一度「無料OCRで読み取る」を押してください。';
}
function usefulScore(r){
  const txt=(r.data.text||'').trim();
  const chars=(txt.match(/[A-Za-z0-9一-龯ぁ-んァ-ヶ]/g)||[]).length;
  const contacts=(txt.match(/@|TEL|FAX|〒|\d{2,4}[-ー]\d{2,4}/gi)||[]).length;
  return (r.data.confidence||0) + Math.min(chars,80)*0.35 + contacts*8;
}
async function runOCR(){
  if(!preview.src){alert('先に名刺画像を選択してください');return}
  if(typeof Tesseract==='undefined'){alert('OCRライブラリを読み込めません。インターネット接続を確認してください。');return}
  ocrBtn.disabled=true;ocrBar.style.width='2%';rawOcr.value='';
  ocrStatus.textContent='画像を補正してOCRを準備しています…';
  try{
    const worker=await Tesseract.createWorker('jpn+eng',1,{logger:m=>{
      if(m.progress!=null){let p=Math.round(m.progress*100);ocrBar.style.width=p+'%';ocrStatus.textContent=(m.status||'OCR処理中')+' '+p+'%'}
    }});
    let candidates=[];
    // First: current orientation.
    let img0=await makeProcessed(0);
    let r0=await worker.recognize(img0);
    candidates.push({angle:0,r:r0,score:usefulScore(r0)});
    // If recognition is weak, automatically test right and left 90 degrees.
    if((r0.data.confidence||0)<65 || (r0.data.text||'').trim().length<25){
      ocrStatus.textContent='向きを変えて再判定しています…';
      for(const a of [90,270]){
        let imga=await makeProcessed(a);
        let rr=await worker.recognize(imga);
        candidates.push({angle:a,r:rr,score:usefulScore(rr)});
      }
    }
    await worker.terminate();
    candidates.sort((a,b)=>b.score-a.score);
    const best=candidates[0];
    rawOcr.value=best.r.data.text||'';
    ocrBar.style.width='100%';
    if(!rawOcr.value.trim() || (best.r.data.confidence||0)<25){
      fill({date:new Date().toISOString().slice(0,10),status:'未対応'});
      ocrStatus.textContent='十分に読み取れませんでした。名刺を画面いっぱいに撮影するか、左右90°ボタンで向きを直して再度お試しください。';
      return;
    }
    parseAndFill(rawOcr.value);
    ocrStatus.textContent=`OCR完了（自動判定角度 ${best.angle}° / 信頼度 ${Math.round(best.r.data.confidence||0)}%）。内容を確認・修正してください。`;
  }catch(e){
    console.error(e);
    ocrStatus.textContent='OCRでエラーが発生しました。通信状態を確認して、もう一度お試しください。';
    alert('OCRに失敗しました: '+e.message);
  }finally{ocrBtn.disabled=false}
}

function save(){let o={id:Date.now(),image:preview.src};defs.forEach(([id])=>o[id]=document.getElementById(id).value);let a=JSON.parse(localStorage.getItem('epoCards')||'[]');a.unshift(o);localStorage.setItem('epoCards',JSON.stringify(a));alert('登録しました');show('list');render()}
function clearForm(){fill({});preview.classList.add('hidden');ocrBox.classList.add('hidden');rawOcr.value='';ocrBar.style.width='0%'}
function render(){let a=JSON.parse(localStorage.getItem('epoCards')||'[]'),s=(q.value||'').toLowerCase();a=a.filter(x=>[x.company,x.name,x.tel,x.email].join(' ').toLowerCase().includes(s));rows.innerHTML=a.map(x=>`<tr><td>${esc(x.company)}</td><td>${esc(x.name)}</td><td>${esc(x.tel)}</td><td>${esc(x.email)}</td><td><span class="badge">${esc(x.status)}</span></td><td><button onclick="del(${x.id})">削除</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">登録データはありません</td></tr>'}
function del(id){if(!confirm('削除しますか？'))return;let a=JSON.parse(localStorage.getItem('epoCards')||'[]').filter(x=>x.id!==id);localStorage.setItem('epoCards',JSON.stringify(a));render()}
function exportCSV(){let a=JSON.parse(localStorage.getItem('epoCards')||'[]');let h=defs.map(x=>x[1]),keys=defs.map(x=>x[0]);let csv='\ufeff'+h.join(',')+'\n'+a.map(o=>keys.map(k=>'"'+String(o[k]||'').replaceAll('"','""')+'"').join(',')).join('\n');let b=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(b),ael=document.createElement('a');ael.href=u;ael.download='EPO名刺管理.csv';ael.click();URL.revokeObjectURL(u)}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function show(v){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));document.getElementById(v).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));if(v==='list')render()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.v));
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
}
</script></body></html>
